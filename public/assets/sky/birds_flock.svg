    <rect x="5" y="2" width="3" height="2" fill="#4d5456" />
    <rect x="8" y="0" width="3" height="2" fill="#4d5456" />
  </g>
  <!-- Bird 5 (Lower Flank 2) -->
  <g transform="translate(68, 58)">
    <rect x="0" y="2" width="3" height="2" fill="#4d5456" />
