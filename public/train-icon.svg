<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" shape-rendering="crispEdges">
  <!-- Pixel Art Locomotive Head (Side View) -->
  
  <!-- Shadow / Underglow -->
  <rect x="8" y="37" width="32" height="1" fill="#000000" opacity="0.2" />

  <!-- Wheels / Maglev Levitation Pods -->
  <!-- Pod 1 -->
  <rect x="10" y="31" width="5" height="4" fill="#0f172a" />
  <rect x="11" y="32" width="3" height="2" fill="#0284c7" />
  <rect x="11" y="34" width="3" height="1" fill="#38bdf8" />
  <rect x="10" y="35" width="5" height="1" fill="#00f5d4" />

  <!-- Pod 2 -->
  <rect x="18" y="31" width="5" height="4" fill="#0f172a" />
  <rect x="19" y="32" width="3" height="2" fill="#0284c7" />
  <rect x="19" y="34" width="3" height="1" fill="#38bdf8" />
  <rect x="18" y="35" width="5" height="1" fill="#00f5d4" />

  <!-- Pod 3 -->
  <rect x="26" y="31" width="5" height="4" fill="#0f172a" />
  <rect x="27" y="32" width="3" height="2" fill="#0284c7" />
  <rect x="27" y="34" width="3" height="1" fill="#38bdf8" />
  <rect x="26" y="35" width="5" height="1" fill="#00f5d4" />

  <!-- Pod 4 -->
  <rect x="34" y="31" width="5" height="4" fill="#0f172a" />
  <rect x="35" y="32" width="3" height="2" fill="#0284c7" />
  <rect x="35" y="34" width="3" height="1" fill="#38bdf8" />
  <rect x="34" y="35" width="5" height="1" fill="#00f5d4" />

  <!-- Undercarriage Chassis -->
  <rect x="7" y="29" width="34" height="2" fill="#1e293b" />
  <rect x="8" y="30" width="32" height="1" fill="#0f172a" />

  <!-- Cowcatcher / Front Guard -->
  <rect x="39" y="30" width="4" height="2" fill="#0f172a" />
  <rect x="40" y="29" width="3" height="1" fill="#1e293b" />

  <!-- Main Body Silhouette / Outline -->
  <rect x="7" y="14" width="22" height="15" fill="#0f172a" />
  <rect x="29" y="15" width="4" height="14" fill="#0f172a" />
  <rect x="33" y="17" width="4" height="12" fill="#0f172a" />
  <rect x="37" y="20" width="4" height="9" fill="#0f172a" />
  <rect x="41" y="24" width="2" height="5" fill="#0f172a" />

  <!-- Roof Air-Intake / Pantograph Cap -->
  <rect x="14" y="11" width="12" height="3" fill="#0f172a" />
  <rect x="15" y="12" width="10" height="2" fill="#1e3a8a" />
  <rect x="16" y="13" width="2" height="1" fill="#fde047" />
  <rect x="19" y="13" width="2" height="1" fill="#fde047" />
  <rect x="22" y="13" width="2" height="1" fill="#fde047" />

  <!-- Main Body Base Fill (Slate / Sky Blue) -->
  <rect x="8" y="15" width="21" height="13" fill="#38bdf8" />
  <rect x="29" y="16" width="3" height="12" fill="#38bdf8" />
  <rect x="32" y="18" width="4" height="10" fill="#38bdf8" />
  <rect x="36" y="21" width="4" height="7" fill="#38bdf8" />
  <rect x="40" y="25" width="2" height="3" fill="#38bdf8" />

  <!-- Roof Aerodynamic Shading (Darker Slate Blue) -->
  <rect x="8" y="15" width="20" height="2" fill="#0284c7" />
  <rect x="28" y="16" width="3" height="2" fill="#0284c7" />
  <rect x="31" y="17" width="3" height="2" fill="#0284c7" />

  <!-- Cab Side Windows -->
  <rect x="9" y="18" width="3" height="5" fill="#164e63" />
  <rect x="10" y="19" width="2" height="3" fill="#67e8f9" />
  <rect x="13" y="18" width="3" height="5" fill="#164e63" />
  <rect x="14" y="19" width="2" height="3" fill="#67e8f9" />
  <rect x="17" y="18" width="3" height="5" fill="#164e63" />
  <rect x="18" y="19" width="2" height="3" fill="#67e8f9" />
  <rect x="21" y="18" width="3" height="5" fill="#164e63" />
  <rect x="22" y="19" width="2" height="3" fill="#67e8f9" />

  <!-- Driver Cockpit Door / Frame -->
  <rect x="25" y="18" width="3" height="10" fill="#0369a1" />
  <rect x="26" y="19" width="1" height="5" fill="#a5f3fc" />

  <!-- Slanted Front Windshield (Glowing Cyan) -->
  <rect x="29" y="18" width="3" height="4" fill="#0891b2" />
  <rect x="32" y="20" width="3" height="3" fill="#0891b2" />
  <rect x="30" y="19" width="2" height="3" fill="#a5f3fc" />
  <rect x="32" y="20" width="2" height="2" fill="#a5f3fc" />
  <rect x="29" y="18" width="1" height="1" fill="#ffffff" />
  <rect x="31" y="19" width="1" height="1" fill="#ffffff" />

  <!-- Iconic Speed Stripes (Orange & Gold) -->
  <rect x="8" y="25" width="32" height="1" fill="#ea580c" />
  <rect x="8" y="26" width="33" height="1" fill="#f59e0b" />
  <rect x="8" y="27" width="32" height="1" fill="#fef08a" />
  <rect x="36" y="25" width="3" height="1" fill="#ea580c" />
  <rect x="36" y="26" width="4" height="1" fill="#f59e0b" />

  <!-- Bright Headlights at Front Nose -->
  <rect x="37" y="22" width="2" height="2" fill="#ffffff" />
  <rect x="39" y="23" width="2" height="2" fill="#fde047" />
  <rect x="41" y="24" width="1" height="2" fill="#fef08a" />
</svg>
